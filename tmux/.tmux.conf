set -g default-terminal "tmux-256color"
# Undercurl and true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:Tc'
# UTF-8 support for icons and special characters
set -q -g status-utf8 on
setw -q -g utf8 on

# Make escape key responsive in Neovim (no delay)
set -sg escape-time 0

# Enable focus events for Neovim autoread
set -g focus-events on

# === PREFIX KEY ===
# Default is Ctrl-b (awkward), change to Ctrl-Space (easier to reach)
unbind C-b              # Remove old prefix
set -g prefix C-Space   # Set new prefix
bind Space send-prefix  # Ctrl-Space Space sends prefix to app (useful if app needs Ctrl-Space)

# === RELOAD CONFIG ===
# Ctrl-Space then r = reload this config file
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# === WINDOW & PANE NUMBERING ===
# Start numbering at 1 (not 0, easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (keeps numbers sequential)
set -g renumber-windows on

# === SPLITTING PANES ===
# Ctrl-Space then | = split vertically (left|right)
# Ctrl-Space then - = split horizontally (top/bottom)
bind | split-window -h -c "#{pane_current_path}"  # -c keeps current directory
bind - split-window -v -c "#{pane_current_path}"

# Remove default split bindings (they're confusing)
unbind '"'
unbind %

# === PANE NAVIGATION (Vim-style) ===
# Ctrl-Space then h/j/k/l = move left/down/up/right between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# === PANE RESIZING ===
# Ctrl-Space then Ctrl-h/j/k/l = resize panes (hold Ctrl for repeat)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Enable mouse (click to select pane, drag to resize, scroll)
set -g mouse on

# Ctrl-Space then [ = enter copy mode (scroll, search, copy)
# In copy mode: v = start selection, y = yank (copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Allow tmux to access system clipboard
set -g set-clipboard on

# Position at top (more like modern editors)
set -g status-position top

# Update status bar every 10 seconds (increase to 15 or 30 if you notice performance issues)
set -g status-interval 10

# Status bar length
set -g status-left-length 50
set -g status-right-length 100

# Auto-rename windows to running program (zsh, nvim, node, etc.)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# kist of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'

# Rose-pine configuration
set -g @rose_pine_variant 'main'

set -g @rose_pine_bar_bg_disable 'on' 
# set -g @rose_pine_only_windows "on"
set -g @rose_pine_disable_active_window_menu 'on'
# set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_user ''
set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_directory 'on'
# set -g @rose_pine_show_current_program "on"
# set -g @rose_pine_window_tabs_enabled 'on'
# set -g @rose_pine_show_pane_directory 'on'
set -g @rose_pine_window_separator ':'
set -g @rose_pine_right_separator ' '
set -g @rose_pine_field_separator ' | '
set -g @rose_pine_window_status_separator "  " 
# set -g @rose_pine_current_window_icon ''
set -g @rose_pine_session_icon ''
# set -g @rose_pine_username_icon ''
# set -g @rose_pine_date_time_icon ''
set -g @rose_pine_folder_icon ''
# set -g @rose_pine_left_separator ' '
set -g @rose_pine_default_window_behavior 'on'
# set -g @rose_pine_prioritize_windows "on" 
set -g @rose_pine_width_to_hide "80"
set -g @rose_pine_status_left_append_section "|   "

# set -g status-left ""

# Keep right side populated by enabling by we want
# set -g @rose_pine_user "on"
#kset -g @rose_pine_host "on"
# ket -g @rose_pine_date_time "%a %H:%M"

#kInitialize TPM
run '~/.tmux/plugins/tpm/tpm'
